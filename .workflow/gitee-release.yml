version: '1.0'
name: eui-windows-release
displayName: EUI Windows 自动发布
triggers:
  push:
    branches:
      precise:
        - master
stages:
  - name: dispatch
    displayName: 触发 Windows 云端构建
    strategy: naturally
    trigger: auto
    steps:
      - step: build@python
        name: dispatch-windows-release
        displayName: 根据 Gitee 版本自动发布
        pythonVersion: '3.9'
        commands:
          - python packaging/gitee_release.py dispatch
        strategy:
          retry: '0'
          resource:
            cpu: '2'
            memory: '4'
