name: Bug 报告 / Bug report
description: 报告可复现的问题 / Report a reproducible problem
body:
  - type: input
    id: component
    attributes:
      label: 组件与 EUI 版本 / Component and EUI version
      placeholder: ETable, v1.0.0 或提交号 / commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境 / Environment
      description: 操作系统和架构、Qt Kit、编译器；使用发布包时注明安装版或免安装版。
      placeholder: Windows 11 x64, Qt 5.15.2 MSVC 2019 x64, Release
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 附上最小 QML 示例或可复现项目 / Include a minimal example when possible.
      placeholder: |
        1. 打开 / Open ...
        2. 操作 / Perform ...
        3. 观察 / Observe ...
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际行为 / Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志与截图 / Logs and screenshots
      description: 提交前移除密码、令牌和个人数据 / Remove credentials and personal data.
